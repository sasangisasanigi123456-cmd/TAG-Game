		// Debug logging
		console.log('Page loaded, initializing game...');
		
		// Hide loading screen when game is ready
		function hideLoadingScreen() {
			const loading = document.getElementById('loadingScreen');
			if (loading) {
				loading.style.opacity = '0';
				loading.style.transition = 'opacity 0.5s';
				setTimeout(() => loading.style.display = 'none', 500);
			}
		}
		
		// Error handling
		window.addEventListener('error', (e) => {
			console.error('Global error:', e.error);
		});
		
		window.addEventListener('unhandledrejection', (event) => {
			console.error('Unhandled promise rejection:', event.reason);
		});
		
		// Force cache busting for data.json
		if (window.caches) {
			try {
				caches.keys().then(cacheNames => {
					cacheNames.forEach(cacheName => {
						caches.delete(cacheName);
					});
				});
			} catch (e) {}
		}
		
		// Clear browser cache
		if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
			navigator.serviceWorker.getRegistrations().then(regs => {
				regs.forEach(r => r.unregister());
			});
		}
		
		// Wait a bit for scripts to load, then try to start
		setTimeout(() => {
			console.log('Calling startup functions...');
			
			// Call register SW
			if (window.C3_RegisterSW) {
				console.log('Registering service worker...');
				window.C3_RegisterSW();
			} else {
				console.log('C3_RegisterSW not found');
			}
			
			// Run startup functions
			if (window.runOnStartup) {
				console.log('Running startup functions...');
				for (const f of (window['c3_runOnStartupFunctions'] || [])) {
					try {
						f();
					} catch(err) {
						console.error('Startup function error:', err);
					}
				}
			}
			
			// Hide loading screen after a delay to let game render
			setTimeout(hideLoadingScreen, 1000);
		}, 500);
		
		// Also hide on click
		document.addEventListener('click', hideLoadingScreen);
	</script>
